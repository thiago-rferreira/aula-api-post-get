<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Lista de heróis</title>
    <link rel="stylesheet" href="../css/get.css" />
    <script src="../js/get.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Lista de heróis</h1>
      <p>Veja abaixo a lista de heróis</p>
    </header>
    <main>
      <p><a href="../index.html">Voltar para o cadastro</a></p>
      <section id="container-titulo-lista">
        <h2 id="titulo-lista">Heróis cadastrados</h2>
        <p>Os heróis são exibidos automaticamente ao abrir a página</p>
        <p id="resposta"></p>
        <ul id="lista-herois"></ul>
      </section>
    </main>

    <!--Modelo para op JS copiar para cada heroi-->
    <template id="modelo-heroi">
      <li>
        <section class="card-capa">
          <img class="imagem-heroi" alt="" />
        </section>
        <section class="card-conteudo">
          <h3 class="nome"></h3>
          <p><strong>Poder:</strong> <span class="poder"> </span></p>
          <p><strong>Universo:</strong> <span class="universo"> </span></p>
          <p><strong>Fraqueza:</strong> <span class="fraqueza"> </span></p>
        </section>
      </li>
    </template>
  </body>
</html>
